main{max-width:1100px;margin:0 auto;padding:20px 18px 90px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
input[type=search]{flex:1 1 220px;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.chip,button{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:all .3s ease}
.chip.on,button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}

.tile{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:var(--text);overflow:hidden;transition:transform .35s ease,box-shadow .35s ease;animation:pop .5s ease both}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow)}

.tile b{display:block;padding:12px 14px 0;color:var(--accent);font-size:17px}

.cmpb{position:absolute;top:10px;right:10px;padding:6px 10px}

.back{display:inline-block;margin-bottom:14px;color:var(--accent);text-decoration:none;font-weight:600}

.layer svg{width:100%;height:100%;overflow:visible;pointer-events:none;display:block}
.layer svg .h{pointer-events:visiblePainted}
.layer.cover{opacity:calc(1 - var(--ex) * .55)}

.layer.bad svg,.layer.bad .disp{filter:drop-shadow(0 0 10px var(--err))}

    drop(){const c=[[20,20],[W-20,20],[20,H-20],[W-20,H-20]][Math.random()*4|0],m=M();ev('drop');bst.classList.remove('drp');void bst.offsetWidth;bst.classList.add('drp');setTimeout(()=>{crack(c[0],c[1],9,70+D[m]/2);add(m,22);add('frm',18);add('cam',c[1]<H/2?12:3);add('brd',6);shake();upd()},520)},
    roll(){ev('roll');bend.classList.remove('rol');void bend.offsetWidth;bend.classList.add('rol');setTimeout(()=>{for(const c of[cF,cB])on(c,()=>{for(let i=0;i<5;i++)crack(R(20,W-20),R(40,H-40),6,R(80,160))});add('scr',60);add('bk',60);add('brd',45);add('frm',70);add('bat',40);add('cam',50);if(D.bat>=100&&!D.boom)boom(W/2,H/2);shake();upd()},350)},
    mw(){if(micro)return;ev('mw');micro=260;$('#mw').hidden=false},
    pierce(x,y){ev('pierce');crack(x,y,3,25);const zy=y/H;if(zy>.25&&zy<.8){add('bat',45);ignite(x,y);flames(x,y,25);add('brd',10)}else add('brd',3);shake()}
  };
  const IM=['drop','roll','mw'];
  const loop=()=>{fr++;cf.clearRect(0,0,W,H);
    if(micro>0){micro--;add('brd',.5);add('bat',.45);add('scr',.3);add('bk',.1);add('cam',.2);
      if(fr%4==0){const x=Math.random()<.5?R(8,30):R(W-30,W-8),y=R(20,H-20);fx.push({t:'b',pts:[[x,y],[x+R(-20,20),y+R(-20,20)],[x+R(-30,30),y+R(-30,30)]],l:1})}
      if(micro===0){$('#mw').hidden=true;if(D.bat>=100&&!D.boom)boom(W/2,H/2)}upd()}
    if(fire){add(M(),.2);add('frm',.02);D.ev.fire=1;const zy=fire.y/H;if(face==='b'&&camZ(fire.x,fire.y))add('cam',.3);if(zy>.25&&zy<.8)add('bat',.3);else if(zy<=.25)add('brd',.25);
      flames(fire.x,fire.y,3);
      if(fr%2==0)fx.push({t:'s',x:fire.x+R(-6,6),y:fire.y-10,vx:R(-.3,.3),vy:-R(.6,1.2),l:1,r:R(6,10)});
      if(fr%8==0)burn(fire.x,fire.y,R(14,26),.1);
      if(D.bat>=100&&!D.boom)boom(fire.x,fire.y);upd()}
    for(const f of D.fl){const zy=f.y/H;flames(f.x,f.y,2);if(fr%3==0)fx.push({t:'s',x:f.x+R(-6,6),y:f.y-10,vx:R(-.3,.3),vy:-R(.6,1.2),l:1,r:R(6,10)});if(fr%12==0)burn(f.x,f.y,R(14,26),.1);add(M(),.15);add('frm',.02);if(zy>.25&&zy<.8)add('bat',.18);else add('brd',.12)}
    if(D.fl.length&&fr%100==0&&D.fl.length<9){const f=D.fl[D.fl.length*Math.random()|0];ignite(f.x+R(-45,45),f.y+R(-45,45))}
    if(!D.boom&&D.bat>55&&Math.random()<(D.bat-55)*.00003){ignite(W/2+R(-25,25),H/2+R(-40,40));if(D.bat>=85&&Math.random()<.3)boom(W/2,H/2)}
    if(D.prt>8){add('brd',D.prt*.0005);if(D.prt>45&&fr%18==0){const x=W/2+R(-14,14);fx.push({t:'b',pts:[[x,H-8],[x+R(-14,14),H-24],[x+R(-20,20),H-44]],l:1});add('bat',.5)}if(D.prt>85&&!D.boom&&Math.random()<.003){ignite(W/2,H-30);add('bat',15)}}
    if(D.fl.length||D.prt>8)upd();
    cf.globalCompositeOperation='lighter';
    for(const q of fx){q.x+=q.vx||0;q.y+=q.vy||0;
      if(q.t==='f'){q.l-=.025;q.r*=.985;cf.fillStyle=`rgba(255,${60+170*q.l|0},20,${q.l*.55})`;cf.beginPath();cf.arc(q.x,q.y,q.r,0,6.3);cf.fill()}
      else if(q.t==='x'){q.vy+=.12;q.l-=.015;cf.fillStyle=`rgba(255,${120+120*q.l|0},40,${q.l})`;cf.fillRect(q.x,q.y,3,3)}
      else if(q.t==='d'){q.vy+=.25;q.l-=.015;cf.fillStyle=`rgba(90,170,255,${q.l})`;cf.beginPath();cf.arc(q.x,q.y,2,0,6.3);cf.fill()}
      else if(q.t==='b'){q.l-=.08;cf.strokeStyle=`rgba(190,220,255,${q.l})`;cf.lineWidth=2;cf.beginPath();q.pts.forEach((a,i)=>i?cf.lineTo(a[0],a[1]):cf.moveTo(a[0],a[1]));cf.stroke()}else if(q.t==='p'){q.vy+=.25;cf.fillStyle=`rgba(${q.c},.9)`;cf.fillRect(q.x,q.y,2,4);if(q.y>=H-14){if(Math.abs(q.x-W/2)<17)D.prt=Math.min(100,D.prt+(wk<.3?.35:.9)*q.k);else add('brd',.04*wk);q.l=0}}else if(q.t==='w'){q.r+=9;q.l-=.04;cf.strokeStyle=`rgba(255,230,180,${Math.max(0,q.l)})`;cf.lineWidth=6;cf.beginPath();cf.arc(q.x,q.y,q.r,0,6.3);cf.stroke()}}
    cf.globalCompositeOperation='source-over';
    for(const q of fx)if(q.t==='s'){q.l-=.012;q.r+=.15;cf.fillStyle=`rgba(60,60,60,${Math.max(0,q.l*.35)})`;cf.beginPath();cf.arc(q.x,q.y,q.r,0,6.3);cf.fill()}
    fx=fx.filter(q=>q.l>0);brkRaf=requestAnimationFrame(loop)};
  const setAng=a=>{ang=a;const q=$('#bflip');q.style.transition='';q.style.transform=`rotateY(${a}deg)`;face=((a/180%2)+2)%2?'b':'f';cd=face==='f'?cF:cB;fire=null};
  const pt=e=>{const r=bst.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  const hit=(x,y,first)=>{if(tool==='turn')return;if(tool==='fire')fire={x,y};else if(tool==='port')pour(x,y);else if(tool==='water'){act.water(x,y);quench(x,y)}else if(tool==='key')act.key(x,y,last[0],last[1]);else if(first&&!IM.includes(tool))act[tool](x,y);last=[x,y];upd()};
  bst.onpointerdown=e=>{down=true;bst.setPointerCapture(e.pointerId);if(tool==='turn'){tdrag={x:e.clientX,a:ang};$('#bflip').style.transition='none';return}const[x,y]=pt(e);last=[x,y];hit(x,y,true)};
  bst.onpointermove=e=>{if(tdrag){ang=tdrag.a+(e.clientX-tdrag.x)*.8;$('#bflip').style.transform=`rotateY(${ang}deg)`;return}if(down){const[x,y]=pt(e);hit(x,y,false)}};
  bst.onpointerup=bst.onpointercancel=()=>{down=false;fire=null;if(tdrag){tdrag=null;setAng(Math.round(ang/180)*180)}};
  const tb=document.querySelectorAll('#tl button');
  const pick=b=>{tool=b.dataset.t;tb.forEach(x=>x.classList.toggle('on',x===b));$('#bh').textContent=TOOLS.find(a=>a[0]===tool)[3];if(IM.includes(tool))act[tool]();upd()};
  tb.forEach(b=>b.onclick=()=>pick(b));
  $('#bliq').onclick=()=>{liq=(liq+1)%3;$('#bliq').textContent=LQ[liq][0]};
  $('#bflp').onclick=()=>setAng(ang+180);
  $('#bx').onclick=stopBrk;$('#bfix').onclick=reset;
  const lv=v=>v<10?0:v<40?1:v<75?2:3,bar=v=>`<div style="height:8px;border-radius:4px;background:var(--line);margin:4px 0"><div style="width:${v}%;height:100%;border-radius:4px;background:${v<40?'var(--ok)':v<75?'#f59e0b':'var(--err)'}"></div></div>`;
  const EV={ham:'ударов молотком',zap:'разрядов',bolt:'ударов молнии',gun:'выстрелов',drop:'падений',roll:'раз под катком',mw:'сеансов в микроволновке',fire:'огонь',water:'вода',key:'царапины',port:'залив разъёма',pierce:'проколов АКБ',boom:'взрыв аккумулятора'};
  $('#brep').onclick=()=>{
    const rows=[['🖥️ Дисплей',D.scr,`${p.panel}, ${p.res}`,['Цел','Трещины и мёртвые пиксели','Сеть трещин, полосы, сенсор отвечает частично','Разбит, картинки нет']],
      ['🪟 Задняя крышка',D.bk,p.mat,['Цела','Царапины и трещины','Сильно разбита, видны внутренности','Рассыпалась']],
      ['🧠 Материнская плата',D.brd,short(p.soc),['Работает штатно','Сбои и перезагрузки','Часть модулей отказала: сеть, камера или зарядка','Мертва, телефон не включится']],
      ['🔋 Аккумулятор',D.bat,p.bat.split(' (')[0],['Исправен','Нагрелся, ёмкость упала','Вздулся и опасен, заряжать нельзя',D.boom?'Тепловой разгон: загорелся и взорвался':'Разрушен']],
      ['📷 Камеры',D.cam,p.cams.split(' + ')[0],['Линзы целы','Царапины, сбитый автофокус','Линзы разбиты, матрица повреждена, кадры с артефактами','Вышли из строя']],
      ['🔌 Разъём',D.prt,'USB-C',['Чистый','Влага на контактах','Залит, контакты корродируют','Замкнул и выгорел']],['🧱 Рамка',D.frm,'',['Цела','Вмятины и царапины','Погнута, экран отходит','Смята'+(/титан/i.test(p.mat)&&D.frm<95?', но титан держался дольше алюминия':'')]]];
    const t=integ(),ip=D.wet?(wk<.3?'Защита справилась: вода почти не проникла':wk<1?'Защита помогла частично, влага внутри':'Защиты почти нет: вода попала на плату'):'Воду не проверяли';
    const evs=Object.entries(D.ev).map(([k,v])=>EV[k]+(v>1?': '+v:'')).join(', ')||'ничего';
    openSheet(`<h2>🔍 Диагностика</h2><div class="sub">${p.name}: ${t>85?'почти как новый':t>50?'жив, но потрёпан':t>20?'скорее мёртв, чем жив':'уничтожен'} (целостность ${t}%)</div><p>Что делали: ${evs}.</p>`+rows.map(r=>`<div style="margin:12px 0"><b>${r[0]}</b> <span class="sub">${r[2]}</span>${bar(r[1])}<small style="color:var(--muted)">${r[3][lv(r[1])]}</small></div>`).join('')+`<div style="margin:12px 0"><b>💧 Влагозащита</b> <span class="sub">${p.ip}</span><br><small style="color:var(--muted)">${ip}</small></div><div style="margin:12px 0"><b>💾 Данные</b><br><small style="color:var(--muted)">${D.brd>=75?'Под угрозой: накопитель придётся доставать в сервисе':'Сохранились'}</small></div>`,true)};
  reset();pick(tb[0]);loop();
}

/* ---------- настройки ---------- */
const S=(()=>{const d={theme:'auto',acc:'',fav:'',anim:1,rot:0};try{return{...d,...JSON.parse(localStorage.getItem('cfg')||'{}')}}catch(e){return d}})();
function applyCfg(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme;if(S.acc){r.style.setProperty('--accent',S.acc);r.style.setProperty('--on','#fff')}else{r.style.removeProperty('--accent');r.style.removeProperty('--on')}r.classList.toggle('noanim',!S.anim);try{localStorage.setItem('cfg',JSON.stringify(S))}catch(e){}}
applyCfg();
function settings(){const row=(t,h)=>`<div style="margin:12px 0"><b>${t}</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${h}</div></div>`,ch=(k,v,t)=>`<button class="${S[k]==v?'on':''}" data-k="${k}" data-v="${v}">${t}</button>`;
  openSheet('<h2>⚙️ Настройки</h2>'+row('Тема',ch('theme','auto','Авто')+ch('theme','light','☀️ Светлая')+ch('theme','dark','🌙 Тёмная'))+row('Цвет акцента',[['','Стандарт'],['#7c3aed','🟣'],['#db2777','🌸'],['#16a34a','🟢'],['#ea580c','🟠']].map(a=>ch('acc',a[0],a[1])).join(''))+row('Анимации',ch('anim',1,'Вкл')+ch('anim',0,'Выкл'))+row('Автовращение телефона',ch('rot',1,'Вкл')+ch('rot',0,'Выкл'))+`<div style="margin:12px 0"><b>⭐ Любимый телефон</b><select id="sFav" style="margin-top:6px"><option value="">— не выбран —</option>${P.map(p=>`<option value="${p.id}" ${S.fav===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>`);
  sheet.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;S[b.dataset.k]=/^[01]$/.test(v)?+v:v;applyCfg();settings()});
  $('#sFav').onchange=e=>{S.fav=e.target.value;applyCfg();if(!location.hash.includes('/phone/'))draw()}}
$('#bSet').onclick=settings;

/* ---------- роутинг ---------- */
function route(){
  closeSheet();stopBrk();$('#tip').style.opacity=0;
  const m=location.hash.match(/^#\/phone\/(.+)$/);
  const p=m&&byId(m[1]);
  if(p){phonePage(p);document.title=p.name+' — Телефоны изнутри'}else{list();document.title='Телефоны изнутри'}
  scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
