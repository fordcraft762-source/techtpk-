    $('#lwk').textContent=D.boom?'Уничтожен взрывом':D.brd>=75?'Не включается':D.scr>=90?'Включается, экрана нет':D.scr>=55||D.brd>=40?'Работает со сбоями':D.bat>45?'Работает, аккумулятор опасен':'Работает штатно';
    $('#lbars').querySelectorAll('.lb').forEach(e=>{const h=Math.round(100-val(e.dataset.k)),i=e.querySelector('i');e.querySelector('b').textContent=h+'%';i.style.width=h+'%';i.style.background=col(h)});
    const xz=$('#xr');if(!xz.hidden)xz.querySelectorAll('i').forEach(e=>{e.style.background=`hsl(${Math.max(0,(100-D[e.dataset.z])*1.2)} 85% 45% / .5)`});
    const hv=$('#hgv');if(hv){hv.style.opacity=.4+D.hng/170;hv.style[flipF?'height':'width']=3+D.hng/12+'px';hv.style.boxShadow=`0 0 ${D.hng/5}px rgba(255,80,60,${D.hng/110})`;hv.style.background=D.hng>45?'#000':'rgba(255,255,255,.4)'}};
  // журнал
  const LG=[],log=txt=>{const s=(performance.now()-t0)/1000|0;LG.unshift(`<li><time>${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</time> ${txt}</li>`);LG.length=Math.min(LG.length,50);$('#llog').innerHTML=LG.join('')};
  const NM={scr:'Экран',brd:'Плата',bat:'Аккумулятор',cam:'Камеры',frm:'Рамка',bk:'Крышка',hng:'Шарнир',prt:'Разъём'},MS=[[100,'полностью выведен из строя'],[75,'критическое состояние'],[40,'серьёзно повреждён'],[10,'первые повреждения']];
  const LT={ham:'🔨 Удар молотком',zap:'⚡ Разряд',bolt:'⛈️ Удар молнии',gun:'🔫 Выстрел',drop:'⬇️ Падение',roll:'🚜 Каток',mw:'📡 Микроволновка',fire:'🔥 Возгорание',water:'💧 Вода',key:'🗝️ Царапины',port:'🔌 Залит разъём',pierce:'🪡 Прокол аккумулятора',boom:'💥 Взрыв аккумулятора'};
  let pv={},pe={},lt=0,ht=0;
  hook=()=>{if(!D)return;const n=performance.now();if(n-lt<120){if(!ht)ht=setTimeout(()=>{ht=0;lt=0;hook()},130);return}lt=n;refresh();
    if(integ()===100&&!Object.keys(D.ev).length&&Object.values(pv).some(v=>v>0)){log('Состояние сброшено');pv={};pe={};return}
    for(const k in NM){const v=D[k]||0,a=pv[k]||0;const m=MS.find(m=>a<m[0]&&v>=m[0]);if(m)log(`${NM[k]}: ${m[1]}`);pv[k]=v}
    for(const k in D.ev)if(D.ev[k]>(pe[k]||0)){log(LT[k]+(D.ev[k]>1?` ×${D.ev[k]}`:''));pe[k]=D.ev[k]}};
  // запуск, остановка, повтор
  const halt=()=>{tms.forEach(clearTimeout);tms.length=0;fire=null;micro=0;$('#mw').hidden=true;playing=false};
  window.brkClean=()=>{halt();clearTimeout(ht);ht=0};
  const sched=(steps,done)=>{halt();playing=true;let end=0;steps.forEach(([t,f])=>{end=Math.max(end,t);tms.push(setTimeout(()=>{try{f();upd()}catch(_){}},t*SLOW))});tms.push(setTimeout(()=>{playing=false;fire=null;if(done)done();bl(880);log('✔ Сценарий завершён')},end*SLOW+700))};
  const runScn=id=>{const c=SC.find(x=>x[0]===id);reset();setFold(0);lastRun={scn:id};log('▶ '+c[2]);bl(520);sched(c[3])};
  const playRec=ev=>{reset();setFold(0);lastRun={rec:1};log('↺ Повтор действий');bl(520);const b0=ev[0].t;
    sched(ev.map(e=>[e.t-b0,e.k==='p'?()=>pick(tbBy(e.tool)):e.k==='d'?()=>{tool=e.tool;if(e.a!==ang)setAng(e.a);last=[e.x,e.y];hit(e.x,e.y,true)}:e.k==='m'?()=>hit(e.x,e.y,false):()=>{fire=null}]))};
  const pd=bst.onpointerdown,pm=bst.onpointermove,pu=bst.onpointerup;
  bst.onpointerdown=e=>{if(!playing&&tool!=='turn'){const[x,y]=pt(e);if(rec.length>400)rec.shift();rec.push({k:'d',t:performance.now(),tool,x,y,a:ang});lastRun={rec:1}}pd(e)};
  bst.onpointermove=e=>{if(down&&!playing&&tool!=='turn'){const[x,y]=pt(e);rec.push({k:'m',t:performance.now(),x,y})}pm(e)};
  bst.onpointerup=bst.onpointercancel=bst.onlostpointercapture=e=>{if(!playing&&down)rec.push({k:'u',t:performance.now()});pu(e)};
  tb.forEach(b=>{const f=b.onclick;b.onclick=()=>{if(!playing){rec.push({k:'p',t:performance.now(),tool:b.dataset.t});lastRun={rec:1}}bl(480);f()}});
  const tg=(id,on)=>$(id).classList.toggle('on',!!on);
  $('#lscn').onclick=e=>{const b=e.target.closest('button');if(!b)return;sel=b.dataset.s;$('#lscn').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));bl()};
  $('#lgo').onclick=()=>runScn(sel);
  $('#lst').onclick=()=>{halt();D.fl=[];upd();log('⏹ Остановлено');bl(300)};
  $('#lrp').onclick=()=>{if(lastRun&&lastRun.scn)runScn(lastRun.scn);else if(rec.length)playRec([...rec]);else log('Пока нечего повторять')};
  $('#lrs').onclick=()=>{halt();reset();setFold(0);if(ba)$('#lba').click();lt=0;hook();bl(400)};
  $('#lint').oninput=e=>{INT=e.target.value/100;$('#lin').textContent=e.target.value+'%';save()};
  if(fold)$('#lfd').oninput=e=>{const v=+e.target.value;add('hng',Math.abs(v-fv)*.04);setFold(v);upd()};
  $('#lba').onclick=()=>{ba=!ba;o.classList.toggle('ba',ba);tg('#lba',ba);bl()};
  $('#lxr').onclick=()=>{xr=!xr;$('#xr').hidden=!xr;tg('#lxr',xr);save();refresh();bl()};
  $('#lov').onclick=()=>{look=true;ang+=90;const q=$('#bflip');q.style.transition='transform .6s';q.style.transform=`rotateY(${ang}deg)`;bl()};
  const setZ=v=>{zoom=Math.max(.6,Math.min(1.8,v));wr.style.setProperty('--bz',zoom)};
  $('#lzp').onclick=()=>setZ(zoom*1.15);$('#lzm').onclick=()=>setZ(zoom/1.15);
  bst.addEventListener('wheel',e=>{e.preventDefault();setZ(zoom*(e.deltaY<0?1.08:.93))},{passive:false});
  $('#lsl').onclick=()=>{SLOW=SLOW>1?1:3;o.classList.toggle('slow',SLOW>1);tg('#lsl',SLOW>1);save();bl()};
  $('#llt').onclick=()=>{LITE=!LITE;tg('#llt',LITE);save();bl()};
  $('#lsn').onclick=()=>{S.snd=S.snd?0:1;applyCfg();tg('#lsn',S.snd);$('#lsn').textContent=S.snd?'🔊 Звук':'🔇 Звук';if(S.snd)bl()};
  o.classList.toggle('slow',SLOW>1);tg('#lsl',SLOW>1);tg('#llt',LITE);tg('#lxr',xr);tg('#lsn',S.snd);$('#lsn').textContent=S.snd?'🔊 Звук':'🔇 Звук';$('#xr').hidden=!xr;
  reset();pick(tb[0]);loop();
}

/* ---------- достижения ---------- */
const AC={boom:['💥','Бабах!','Взорвать аккумулятор'],fire:['🔥','Поджигатель','Поджечь телефон'],self:['🌡️','Само загорелось','Телефон загорелся от перегрева'],port:['🔌','Утопленник','Полностью залить разъём'],pierce:['🪡','Игла','Проткнуть аккумулятор'],fireman:['🧯','Пожарный','Потушить огонь водой'],all:['🛠️','Разрушитель','Попробовать все инструменты'],fold:['📖','Раскладушка','Полностью сложить складной телефон'],quiz:['🎯','Знаток','5 верных ответов в «Найди деталь»'],coll:['🗂️','Коллекционер','Открыть 10 разных телефонов'],make:['➕','Создатель','Добавить свой телефон'],style:['🎨','Дизайнер','Сменить тему или цвет акцента'],fav:['⭐','Любимчик','Выбрать любимый телефон'],lunch:['🍕','Обед готов','Отправить телефон в микроволновку',1],thor:['⚡','Громовержец','5 ударов молнии за один сеанс',1],hammer:['🔨','Кузнец','30 ударов молотком',1],sniper:['🔫','Меткий стрелок','10 выстрелов',1],flat:['🥞','Блин','Раскатать телефон катком',1],cola:['🥤','Липкий разъём','Залить разъём колой',1]};
let AD=[],SEEN=[];try{AD=JSON.parse(localStorage.getItem('ach')||'[]');SEEN=JSON.parse(localStorage.getItem('seen')||'[]')}catch(e){}
const acN=()=>{$('#ac').textContent=AD.length+'/'+Object.keys(AC).length};acN();
let tt=0;
function ach(id){if(AD.includes(id)||!AC[id])return;AD.push(id);snd(660,.12,'sine',.12,1.5);setTimeout(()=>snd(990,.2,'sine',.12,1),120);try{localStorage.setItem('ach',JSON.stringify(AD))}catch(e){}acN();
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.innerHTML='🏆 Достижение: '+AC[id][0]+' <b>'+AC[id][1]+'</b>';void t.offsetWidth;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
function seen(id){if(!SEEN.includes(id)){SEEN.push(id);try{localStorage.setItem('seen',JSON.stringify(SEEN))}catch(e){}}if(SEEN.length>=10)ach('coll')}
$('#bAch').onclick=()=>{openSheet('<h2>🏆 Достижения</h2><div class="sub">Открыто: '+AD.length+' из '+Object.keys(AC).length+'</div>'+Object.entries(AC).map(([k,a])=>{const o=AD.includes(k);if(a[3]&&!o)a=['❓','Секретное достижение','Продолжайте ломать, и узнаете'];return `<div style="display:flex;gap:12px;align-items:center;margin:10px 0;${o?'':'opacity:.45'}"><span style="font-size:28px;${o?'':'filter:grayscale(1)'}">${a[0]}</span><div><b>${a[1]}</b><br><small style="color:var(--muted)">${a[2]}</small></div>${o?'<span style="margin-left:auto;color:var(--ok)">✓</span>':''}</div>`}).join('')+'<button id="acR" style="margin:6px 0 10px">🗑 Сбросить прогресс</button>');$('#acR').onclick=()=>{if(confirm('Сбросить все достижения?')){AD=[];SEEN=[];try{localStorage.removeItem('ach');localStorage.removeItem('seen')}catch(e){}acN();$('#bAch').onclick()}}};

/* ---------- настройки ---------- */
const S=(()=>{const d={theme:'auto',acc:'',fav:'',favs:[],sort:'def',anim:1,rot:0,snd:0};try{return{...d,...JSON.parse(localStorage.getItem('cfg')||'{}')}}catch(e){return d}})();
function applyCfg(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme;if(S.acc){r.style.setProperty('--accent',S.acc);r.style.setProperty('--on','#fff')}else{r.style.removeProperty('--accent');r.style.removeProperty('--on')}r.classList.toggle('noanim',!S.anim);try{localStorage.setItem('cfg',JSON.stringify(S))}catch(e){}}
if(!Array.isArray(S.favs))S.favs=[];
applyCfg();
let AU;const snd=(f,d,t='square',v=.15,n=.3)=>{if(!S.snd)return;try{AU=AU||new(window.AudioContext||window.webkitAudioContext)();const c=AU.currentTime,o=AU.createOscillator(),g=AU.createGain();o.type=t;o.frequency.setValueAtTime(f,c);o.frequency.exponentialRampToValueAtTime(Math.max(20,f*n),c+d);g.gain.setValueAtTime(v,c);g.gain.exponentialRampToValueAtTime(.001,c+d);o.connect(g);g.connect(AU.destination);o.start();o.stop(c+d)}catch(e){}};
const vib=q=>{try{S.snd&&navigator.vibrate&&navigator.vibrate(q)}catch(e){}};
function settings(){const row=(t,h)=>`<div style="margin:12px 0"><b>${t}</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${h}</div></div>`,ch=(k,v,t)=>`<button class="${S[k]==v?'on':''}" data-k="${k}" data-v="${v}">${t}</button>`;
  openSheet('<h2>⚙️ Настройки</h2>'+row('Тема',ch('theme','auto','Авто')+ch('theme','light','☀️ Светлая')+ch('theme','dark','🌙 Тёмная'))+row('Цвет акцента',[['','Стандарт'],['#7c3aed','🟣'],['#db2777','🌸'],['#16a34a','🟢'],['#ea580c','🟠']].map(a=>ch('acc',a[0],a[1])).join(''))+row('Анимации',ch('anim',1,'Вкл')+ch('anim',0,'Выкл'))+row('Автовращение телефона',ch('rot',1,'Вкл')+ch('rot',0,'Выкл'))+row('Звук и вибрация',ch('snd',1,'Вкл')+ch('snd',0,'Выкл'))+`<div style="margin:12px 0"><b>⭐ Любимый телефон</b><select id="sFav" style="margin-top:6px"><option value="">— не выбран —</option>${P.map(p=>`<option value="${p.id}" ${S.fav===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>`);
  sheet.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;S[b.dataset.k]=/^[01]$/.test(v)?+v:v;if(b.dataset.k==='theme'||b.dataset.k==='acc')ach('style');applyCfg();settings()});
  $('#sFav').onchange=e=>{S.fav=e.target.value;if(S.fav)ach('fav');applyCfg();if(!location.hash.includes('/phone/'))draw()}}
$('#bSet').onclick=settings;
$('#bTh').onclick=()=>{const dk=matchMedia('(prefers-color-scheme: dark)').matches,c=S.theme==='auto'?(dk?'dark':'light'):S.theme;S.theme=c==='dark'?'light':'dark';try{ach('style')}catch(_){}applyCfg()};

/* ---------- роутинг ---------- */
function route(){
  closeSheet();{const a=$('#app');a.classList.remove('vw');void a.offsetWidth;a.classList.add('vw')}stopBrk();$('#tip').style.opacity=0;
  const m=location.hash.match(/^#\/phone\/(.+)$/);
  const p=m&&byId(m[1]);
  if(p){seen(p.id);phonePage(p);document.title=p.name+' — Телефоны изнутри'}else{list();document.title='Телефоны изнутри'}
  scrollTo(0,0);
}
{const o=openSheet;openSheet=function(h,w){o(h,w);sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.tabIndex=-1;sheet.focus({preventScroll:true})}}
addEventListener('hashchange',route);route();
</script>
